services:
  - type: web
    name: nestchat-api
    region: oregon
    plan: free
    runtime: node
    buildCommand: NODE_ENV=development pnpm install && pnpm run build
    startCommand: cd packages/server && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "200"

  - type: web
    name: nestchat-admin
    runtime: static
    buildCommand: pnpm install && cd apps/admin && pnpm run build
    staticPublishPath: apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://nestchat-api.onrender.com/api

  - type: web
    name: nestchat-web
    runtime: static
    buildCommand: pnpm install && cd apps/web && pnpm run build
    staticPublishPath: apps/web/dist
